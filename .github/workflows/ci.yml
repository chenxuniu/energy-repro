name: Validate capsule

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install host Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.10.13

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check uv==0.6.14 PyYAML==6.0.3

      - name: Verify dependency lock
        run: uv lock --check --offline

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate guarded host bootstrap syntax
        run: bash -n scripts/setup_docker_nvidia_ubuntu.sh

      - name: Validate all dry-run plans
        shell: bash
        run: |
          set -euo pipefail
          matrix_root="$(mktemp -d)"
          export ENERGY_REPRO_CACHE="${matrix_root}/cache"
          export ENERGY_REPRO_RUNS="${matrix_root}/runs"
          export ENERGY_REPRO_STATE="${matrix_root}/state"

          count=0
          for profile in upstream-exact h100-portable; do
            for recipe in kd-1b kd-7b kd-13b sft-1b sft-7b sft-13b; do
              for stage in preprocess teacher student; do
                ./repro run \
                  --profile "${profile}" \
                  --recipe "${recipe}" \
                  --stage "${stage}" \
                  --seed 42 \
                  --attempt 1 \
                  --ack-known-deviations \
                  --dry-run \
                  --json >/dev/null
                count=$((count + 1))
              done
            done
          done

          for recipe in kd-1b-pilot sft-1b-pilot; do
            for stage in preprocess teacher student; do
              ./repro run \
                --profile h100-portable \
                --recipe "${recipe}" \
                --stage "${stage}" \
                --seed 42 \
                --attempt 1 \
                --ack-known-deviations \
                --dry-run \
                --json >/dev/null
              count=$((count + 1))
            done
          done

          for stage in preprocess student; do
            ./repro run \
              --profile h100-portable \
              --recipe sft-original-1b-pilot \
              --stage "${stage}" \
              --seed 42 \
              --attempt 1 \
              --ack-known-deviations \
              --dry-run \
              --json >/dev/null
            count=$((count + 1))
          done

          for profile in upstream-exact paper-strict h100-portable; do
            ./repro doctor --profile "${profile}" --dry-run --json >/dev/null
            ./repro smoke \
              --profile "${profile}" \
              --kind telemetry \
              --dry-run \
              --json >/dev/null
            count=$((count + 2))
          done

          ./repro export-results \
            fixture-run \
            --output "${matrix_root}/public-result" \
            --archive "${matrix_root}/public-result.tar.gz" \
            --dry-run \
            --json >/dev/null
          count=$((count + 1))

          test "${count}" -eq 51
          test ! -e "${ENERGY_REPRO_CACHE}"
          test ! -e "${ENERGY_REPRO_RUNS}"
          test ! -e "${ENERGY_REPRO_STATE}"
          test ! -e "${matrix_root}/public-result"
          test ! -e "${matrix_root}/public-result.tar.gz"
          echo "Validated ${count} dry-run plans."
